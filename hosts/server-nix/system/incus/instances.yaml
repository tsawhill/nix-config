# eth0 is the legacy LAN; each zone gets its own NIC on its VLAN, named after the zone.
# wan stays down until takeover, when the router gives it OPNsense's WAN MAC (Incus refuses duplicates).
networking-router-nix:
  type: "container"
  profiles: ["nixos-lxc"]
  config:
    boot.autostart.priority: "100"
  devices:
    root: { type: "disk", path: "/", pool: "rpool", size: "4GiB" }
    nix-store: { type: "disk", path: "/nix", source: "/mnt/nix-stores/networking-router-nix" }
    eth0: { type: "nic", nictype: "bridged", parent: "br0", hwaddr: "02:c9:07:cb:e2:47" }
    trusted: { type: "nic", nictype: "bridged", parent: "br0", vlan: "10", hwaddr: "02:c9:07:cb:e2:10", name: "trusted" }
    networking: { type: "nic", nictype: "bridged", parent: "br0", vlan: "20", hwaddr: "02:c9:07:cb:e2:20", name: "networking" }
    services: { type: "nic", nictype: "bridged", parent: "br0", vlan: "30", hwaddr: "02:c9:07:cb:e2:30", name: "services" }
    guests: { type: "nic", nictype: "bridged", parent: "br0", vlan: "40", hwaddr: "02:c9:07:cb:e2:40", name: "guests" }
    iot: { type: "nic", nictype: "bridged", parent: "br0", vlan: "50", hwaddr: "02:c9:07:cb:e2:50", name: "iot" }
    wan: { type: "nic", nictype: "bridged", parent: "br1", hwaddr: "02:c9:07:cb:e2:99", name: "wan" }
    transit: { type: "nic", nictype: "bridged", parent: "br2", hwaddr: "02:2b:99:b7:74:01", name: "transit" }


