[package]
name = "periph"
version = "0.1.0"
edition = "2021"
description = "Declarative settings for USB mice and keyboards"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
